name: Scrapling Cloud Test

on:
  workflow_dispatch:

jobs:
  test-scrapling:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # 首次下载浏览器+Camoufox 较慢，放宽超时

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          # 关键步骤：下载 Scrapling 所需的全部浏览器与指纹依赖
          scrapling install

      - name: Run Scrapling Test
        run: python test_scrapling.py
