name: Probe HK Stock News Sources

on:
  workflow_dispatch: # 支援手動觸發測試

jobs:
  probe:
    runs-on: ubuntu-latest
    name: Probe Sources on US IP
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Scrapling, Patchright and curl_cffi
        run: |
          python -m pip install --upgrade pip
          pip install scrapling patchright curl-cffi

      - name: Install Patchright Chromium with System Dependencies
        run: |
          # 安裝 Patchright Chromium 瀏覽器核心與 Linux 系統相依庫
          patchright install --with-deps chromium

      - name: Run Probe Script
        run: |
          python probe_sources.py

      - name: Publish Summary to GitHub Actions
        if: always()
        run: |
          if [ -f probe_report.md ]; then
            cat probe_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: probe_report.md
          retention-days: 7
