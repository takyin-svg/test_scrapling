name: Test Zhitong Time Parser

on:
  workflow_dispatch: # 支援在 GitHub 網頁 Actions 頁籤手動點擊「Run workflow」
  push:
    paths:
      - 'test_zhitong_time.py' # 當推動 test_zhitong_time.py 時自動觸發

jobs:
  run-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # 設定超時防護

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # 確保 Playwright 瀏覽器及其系統相依函式庫完整就緒
          playwright install chromium --with-deps

      - name: Run Zhitong Time Test
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python test_zhitong_time.py
